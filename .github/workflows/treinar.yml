name: Treinar modelo

on:
  schedule:
    - cron: "20 9 * * 1"   # segunda-feira, 6h20 em Brasília
  workflow_dispatch:
    inputs:
      historico:
        description: "Baixar também a série histórica de máximas anuais da ANA"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  treinar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coletor/requirements.txt
      - run: pip install -r coletor/requirements.txt
      - name: Treinar
        run: python -m coletor.treinar --todas ${{ inputs.historico && '--historico' || '' }}
      - name: Salvar no repositório
        run: |
          git config user.name "monitor-cheias[bot]"
          git config user.email "monitor-cheias@users.noreply.github.com"
          git add dados
          git diff --cached --quiet && exit 0
          git commit -m "Modelo retreinado: $(date -u +'%Y-%m-%d')"
          git pull --rebase --autostash
          git push
