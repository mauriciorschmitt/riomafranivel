name: Testes

on:
  push:
    paths: ["coletor/**", "tests/**", "config/**"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r coletor/requirements.txt pytest
      - run: python -m pytest -q tests
