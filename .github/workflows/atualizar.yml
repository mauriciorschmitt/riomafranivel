name: Atualizar dados

on:
  schedule:
    - cron: "7,37 * * * *"   # a cada 30 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coletor/requirements.txt
      - run: pip install -r coletor/requirements.txt
      - name: Coletar e publicar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python -m coletor.gerar --todas
      - name: Salvar no repositório
        run: |
          git config user.name "monitor-cheias[bot]"
          git config user.email "monitor-cheias@users.noreply.github.com"
          git add docs/dados dados
          git diff --cached --quiet && exit 0
          git commit -m "Dados: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
