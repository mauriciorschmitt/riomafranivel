name: Atualizar dados

on:
  schedule:
    - cron: "10,40 * * * *"   # reserva: o disparo principal vem do cron-job.org
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coletor/requirements.txt
      - run: pip install -r coletor/requirements.txt
      - name: Coletar e publicar
        run: python -m coletor.gerar --todas
      # só quando o rio mudou de faixa: instala o navegador e manda o alerta com a imagem do boletim
      - name: Alertas no Telegram
        if: hashFiles('dados/*/alerta_pendente.json') != ''
        continue-on-error: true  # alerta com problema não pode impedir de salvar os dados
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m coletor.alertas --pendentes
      - name: Salvar no repositório
        run: |
          git config user.name "monitor-cheias[bot]"
          git config user.email "monitor-cheias@users.noreply.github.com"
          git add docs dados
          git diff --cached --quiet && exit 0
          git commit -m "Dados: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
